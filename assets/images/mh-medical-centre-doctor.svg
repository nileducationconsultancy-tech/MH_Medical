<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="600" fill="url(#docBg)" />
  
  <!-- Doctor Avatar Illustration -->
  <circle cx="300" cy="220" r="85" fill="#e2e8f0" stroke="#0284c7" stroke-width="3" />
  
  <!-- Face & Hair -->
  <path d="M 230,190 Q 300,120 370,190 Q 300,150 230,190 Z" fill="#334155" />
  
  <!-- Stethoscope around neck -->
  <path d="M 260,285 Q 300,380 340,285" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />
  <circle cx="300" cy="380" r="14" fill="#0f766e" />
  <circle cx="300" cy="380" r="8" fill="#ffffff" />
  
  <!-- Doctor Coat / Body -->
  <path d="M 160,540 L 220,320 L 380,320 L 440,540 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
  <path d="M 270,320 L 300,430 L 330,320 Z" fill="#0284c7" />
  
  <!-- Medical Tag -->
  <rect x="120" y="470" width="360" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="300" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#0f766e">Dr. Feroz Khan</text>
  <text x="300" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#475569">MBBS | Consultant Physician</text>
</svg>
