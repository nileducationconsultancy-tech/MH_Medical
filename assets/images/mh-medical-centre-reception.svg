<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  
  <!-- Wall & Floor -->
  <rect width="800" height="460" fill="url(#wallGrad)" />
  <rect y="460" width="800" height="140" fill="#e2e8f0" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#cbd5e1" stroke-width="3" />
  
  <!-- Back Wall Sign -->
  <rect x="250" y="80" width="300" height="70" rx="8" fill="#0f766e" />
  <text x="400" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">MH MEDICAL RECEPTION</text>

  <!-- Reception Counter -->
  <path d="M 180,480 L 220,310 L 580,310 L 620,480 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
  <line x1="220" y1="360" x2="580" y2="360" stroke="#0284c7" stroke-width="5" />
  
  <!-- Computer Monitor & Desk Accessories -->
  <rect x="360" y="245" width="80" height="55" rx="4" fill="#334155" />
  <rect x="365" y="250" width="70" height="45" rx="2" fill="#38bdf8" fill-opacity="0.3" />
  <rect x="395" y="300" width="10" height="10" fill="#475569" />
  <rect x="380" y="308" width="40" height="4" rx="1" fill="#475569" />

  <!-- Reception Desk Items -->
  <rect x="280" y="295" width="45" height="15" rx="2" fill="#0f766e" />
  <rect x="475" y="285" width="30" height="25" rx="3" fill="#cbd5e1" />
  <line x1="480" y1="280" x2="480" y2="295" stroke="#64748b" stroke-width="3" />
  <line x1="488" y1="275" x2="488" y2="295" stroke="#0f766e" stroke-width="3" />

  <!-- Waiting Chairs -->
  <rect x="60" y="360" width="80" height="90" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="2" />
  <rect x="660" y="360" width="80" height="90" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="2" />

  <!-- Replacement Tag -->
  <rect x="250" y="520" width="300" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="400" y="543" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">
    [ Genuine Reception Area Photo Placeholder ]
  </text>
</svg>
